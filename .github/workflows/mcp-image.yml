name: mcp-image

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mcp-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/adaptlypost/adaptlypost-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: typecheck
        working-directory: mcp-server
        run: |
          bun install
          bunx tsc --noEmit

      - name: the tool list matches what was submitted for review
        working-directory: mcp-server
        run: node check-declared-tools.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: mcp-server
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the tag to deploy
        run: echo "deploy with ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
